<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="380" fill="none">
    
    <defs>
      <!-- Embedded Styles in XML CDATA -->
      <style type="text/css"><![CDATA[
        .display-title {
          font-family: 'Montserrat', 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
        }
        .editorial-title {
          font-family: 'Cinzel', 'Playfair Display', 'Didot', Georgia, serif;
          font-weight: 700;
          letter-spacing: 0.08em;
        }
        .editorial-script {
          font-family: 'Pacifico', 'Cinzel', 'Playfair Display', 'Brush Script MT', cursive, sans-serif;
          letter-spacing: 0.02em;
        }
        .editorial-sans {
          font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-weight: 500;
        }
        .code-mono {
          font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
        }
        
        /* Subtle Shimmer & Pulse Keyframes */
        @keyframes subtlePulse {
          0%, 100% { opacity: 0.85; }
          50% { opacity: 1; }
        }
        @keyframes glint {
          0%, 100% { transform: scale(0.95); opacity: 0.7; }
          50% { transform: scale(1.08); opacity: 1; }
        }
        
        .pulse-anim {
          animation: subtlePulse 3s ease-in-out infinite;
        }
        .glint-anim {
          animation: glint 3.5s ease-in-out infinite;
          transform-origin: center;
        }
      ]]></style>

      <!-- Signature Barbie Gradient: Hot Pink -> Barbie Pink -> Retro Magenta -->
      <linearGradient id="hero_barbieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FF2D87" />
        <stop offset="50%" stop-color="#E0218A" />
        <stop offset="100%" stop-color="#C71585" />
      </linearGradient>

      <!-- Dreamhouse Blush Satin Gradient -->
      <linearGradient id="hero_blushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="60%" stop-color="#FFF0F5" />
        <stop offset="100%" stop-color="#FFD1DC" />
      </linearGradient>

      <!-- Malibu Cyan Accent Gradient -->
      <linearGradient id="hero_cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00B4D8" />
        <stop offset="100%" stop-color="#0077B6" />
      </linearGradient>

      <!-- Card Glass Backdrop Gradient -->
      <linearGradient id="hero_cardGlass" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
        <stop offset="100%" stop-color="#FFF8FA" stop-opacity="0.95" />
      </linearGradient>

      <!-- Delicate Pink Hairline Gradient -->
      <linearGradient id="hero_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E0218A" stop-opacity="0.40" />
        <stop offset="45%" stop-color="#FFD1DC" stop-opacity="0.25" />
        <stop offset="75%" stop-color="#00B4D8" stop-opacity="0.20" />
        <stop offset="100%" stop-color="#C71585" stop-opacity="0.35" />
      </linearGradient>

      <!-- Winner Gold Accent Gradient -->
      <linearGradient id="hero_goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A" />
        <stop offset="50%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>

      <!-- Soft Ambient Radial Aura -->
      <radialGradient id="hero_radialAura" cx="85%" cy="15%" r="75%">
        <stop offset="0%" stop-color="#E0218A" stop-opacity="0.12" />
        <stop offset="35%" stop-color="#FFD1DC" stop-opacity="0.08" />
        <stop offset="70%" stop-color="#00B4D8" stop-opacity="0.03" />
        <stop offset="100%" stop-color="#FAFAFC" stop-opacity="0" />
      </radialGradient>

      <!-- Glam Drop Shadow Filter -->
      <filter id="hero_cardShadow" x="-10%" y="-10%" width="120%" height="125%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E0218A" flood-opacity="0.14" />
      </filter>

      <!-- Subtle Plaque Glow Filter -->
      <filter id="hero_pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  
    
    <!-- Light Studio Canvas Base with 24px Glam Radius -->
    <rect width="940" height="380" rx="24" fill="#FAFAFC" />
    <rect width="940" height="380" rx="24" fill="url(#hero_radialAura)" />

    <!-- Outer Structural Frame with Soft Glam Shadow (24px Radius) -->
    <rect x="16" y="16" width="908" height="348" rx="24"
          fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.22)" stroke-width="1.2" filter="url(#hero_cardShadow)" />

    <!-- Hairline Gradient Accent along Top Edge -->
    <rect x="16" y="16" width="908" height="4" rx="2" fill="url(#hero_barbieGrad)" />

    <!-- Abstract Barbie Silhouette Vector Graphic -->
    
    <g transform="translate(685, 25) scale(0.85)" opacity="0.09" fill="#E0218A">
      <path d="
        M 10 90
        C 15 65, 30 45, 55 35
        C 80 25, 110 30, 125 50
        C 140 70, 135 100, 115 125
        C 105 138, 95 155, 95 175
        C 95 195, 105 210, 120 225
        C 100 220, 80 210, 68 190
        C 58 175, 58 150, 68 130
        C 75 115, 78 95, 65 80
        C 52 65, 35 68, 25 78
        C 18 85, 14 90, 10 90
        Z
      " />
      <path d="
        M 120 45
        C 145 20, 185 15, 215 35
        C 245 55, 260 95, 240 135
        C 225 165, 195 195, 180 230
        C 170 255, 175 275, 195 295
        C 170 285, 155 260, 155 235
        C 155 205, 180 175, 200 145
        C 220 115, 220 80, 195 60
        C 175 45, 145 42, 120 45
        Z
      " />
      <path d="
        M 68 190
        C 80 220, 105 250, 140 270
        C 115 265, 90 250, 75 230
        C 65 215, 62 200, 68 190
        Z
      " />
    </g>
  

    <!-- Editorial Brand Ribbon (Top Left) -->
    <g transform="translate(48, 48)">
      <rect x="0" y="0" width="144" height="26" rx="13"
            fill="#FFF5F8" stroke="#E0218A" stroke-width="0.8" />
      <text x="72" y="17" text-anchor="middle"
            class="code-mono" font-size="9" font-weight="700" fill="#E0218A" letter-spacing="0.16em">
        ATELIER NO. 500
      </text>
    </g>

    <!-- Top Right Location & Discipline Telemetry Tag -->
    <g transform="translate(892, 48)">
      <text x="0" y="17" text-anchor="end" class="code-mono" font-size="9" font-weight="600" fill="#6B7280" letter-spacing="0.1em">
        PUNE, INDIA // PICT ENTC CLASS OF &apos;28
      </text>
    </g>

    <!-- Centerpiece Typography: Barbiecore Haute Couture -->
    <g transform="translate(48, 124)">
      <!-- Name in High-Fashion Display Sans with Hot Pink Pop -->
      <text x="0" y="0" class="display-title" font-size="44" font-weight="800" fill="#2D2D2D">
        SHAMBHAVI <tspan fill="url(#hero_barbieGrad)">PATIL</tspan>
      </text>

      <!-- Refined Script Accent Above Headline -->
      <text x="2" y="32" class="editorial-script" font-size="21" fill="#C71585">
        ai/ml engineer &amp; systems architect
      </text>

      <!-- Strategic Editorial Positioning Statement -->
      <text x="2" y="66" class="editorial-sans" font-size="14.5" fill="#2D2D2D" font-weight="600">
        Architecting Autonomous Multi-Agent AI, Gymnasium RL Engines &amp; High-Impact Satellite AgriTech
      </text>
    </g>

    <!-- Status & Credential Badges Strip (Pure Telemetry / High Informational Density) -->
    <g transform="translate(48, 240)">
      <!-- Badge 1: Live Internship Role -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="220" height="34" rx="17"
              fill="#FFF5F8" stroke="#E0218A" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#00E676" />
        <text x="28" y="21.5" class="code-mono" font-size="9" font-weight="700" fill="#2D2D2D" letter-spacing="0.04em">
          AI/ML R&amp;D INTERN @ MINDSTRIX
        </text>
      </g>

      <!-- Badge 2: Academic Pedigree -->
      <g transform="translate(232, 0)">
        <rect x="0" y="0" width="190" height="34" rx="17"
              fill="#FFF5F8" stroke="rgba(224, 33, 138, 0.22)" stroke-width="0.9" />
        <circle cx="16" cy="17" r="3.5" fill="#E0218A" />
        <text x="28" y="21.5" class="code-mono" font-size="9" font-weight="700" fill="#2D2D2D" letter-spacing="0.04em">
          PICT ENTC · CGPA 8.6
        </text>
      </g>

      <!-- Badge 3: Flagship Win -->
      <g transform="translate(434, 0)">
        <rect x="0" y="0" width="195" height="34" rx="17"
              fill="#FFD1DC" stroke="#E0218A" stroke-width="0.9" />
        <text x="16" y="21.5" class="code-mono" font-size="9" font-weight="800" fill="#C71585" letter-spacing="0.04em">
          ★ TECHFIESTA &apos;26 WINNER
        </text>
      </g>

      <!-- Badge 4: Government Grant -->
      <g transform="translate(641, 0)">
        <rect x="0" y="0" width="205" height="34" rx="17"
              fill="#FFF5F8" stroke="rgba(224, 33, 138, 0.22)" stroke-width="0.9" />
        <text x="16" y="21.5" class="code-mono" font-size="9" font-weight="700" fill="#2D2D2D" letter-spacing="0.04em">
          ★ ₹15L GRANT · AGRI HACK
        </text>
      </g>
    </g>

    <!-- Bottom Specs Strip -->
    <g transform="translate(48, 320)">
      <line x1="0" y1="0" x2="844" y2="0" stroke="rgba(17, 17, 22, 0.08)" stroke-width="1" />
      <text x="0" y="24" class="code-mono" font-size="9" fill="#6B7280" letter-spacing="0.1em">
        EST. 2025 // 14 PUBLIC REPOSITORIES // 117+ CONTRIBUTIONS // AUTONOMOUS WORKFLOWS
      </text>
      <text x="844" y="24" text-anchor="end" class="code-mono" font-size="9" font-weight="700" fill="#E0218A" letter-spacing="0.12em">
        HAUTE COUTURE SYSTEMS SPECIFICATION
      </text>
    </g>

    <!-- Restrained Luxury Glint Sparkles -->
    
    <g class="glint-anim" style="transform-origin: 840px 105px;">
      <path d="
        M 840 98
        Q 843.08 101.92 847 105
        Q 843.08 108.08 840 112
        Q 836.92 108.08 833 105
        Q 836.92 101.92 840 98
        Z"
        fill="#FF2D87"
        opacity="0.88"
      />
      <circle cx="840" cy="105" r="1.9599999999999997" fill="#FFFFFF" />
    </g>
  
    
    <g class="glint-anim" style="transform-origin: 325px 95px;">
      <path d="
        M 325 89.5
        Q 327.42 92.58 330.5 95
        Q 327.42 97.42 325 100.5
        Q 322.58 97.42 319.5 95
        Q 322.58 92.58 325 89.5
        Z"
        fill="#FF85C0"
        opacity="0.88"
      />
      <circle cx="325" cy="95" r="1.54" fill="#FFFFFF" />
    </g>
  
    
    <g class="glint-anim" style="transform-origin: 875px 235px;">
      <path d="
        M 875 230.5
        Q 876.98 233.02 879.5 235
        Q 876.98 236.98 875 239.5
        Q 873.02 236.98 870.5 235
        Q 873.02 233.02 875 230.5
        Z"
        fill="#FF2D87"
        opacity="0.88"
      />
      <circle cx="875" cy="235" r="1.2600000000000002" fill="#FFFFFF" />
    </g>
  
  </svg>