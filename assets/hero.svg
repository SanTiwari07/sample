<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="100%" height="340" fill="none">
    
    <defs>
      <!-- Embedded Styles in XML CDATA -->
      <style type="text/css"><![CDATA[
        .display-title {
          font-family: 'Montserrat', 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
        }
        .editorial-title {
          font-family: 'Cinzel', 'Playfair Display', 'Didot', Georgia, serif;
          font-weight: 700;
          letter-spacing: 0.08em;
        }
        .editorial-script {
          font-family: 'Pacifico', 'Cinzel', 'Playfair Display', 'Brush Script MT', cursive, sans-serif;
          letter-spacing: 0.02em;
        }
        .editorial-sans {
          font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-weight: 500;
        }
        .code-mono {
          font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
        }
        
        /* Subtle Shimmer & Pulse Keyframes */
        @keyframes subtlePulse {
          0%, 100% { opacity: 0.85; }
          50% { opacity: 1; }
        }
        @keyframes glint {
          0%, 100% { transform: scale(0.95); opacity: 0.7; }
          50% { transform: scale(1.08); opacity: 1; }
        }
        
        .pulse-anim {
          animation: subtlePulse 3s ease-in-out infinite;
        }
        .glint-anim {
          animation: glint 3.5s ease-in-out infinite;
          transform-origin: center;
        }
      ]]></style>

      <!-- Signature Barbie Gradient: Hot Pink -> Barbie Pink -> Retro Magenta -->
      <linearGradient id="hero_barbieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FF2D87" />
        <stop offset="50%" stop-color="#E0218A" />
        <stop offset="100%" stop-color="#C71585" />
      </linearGradient>

      <!-- Dreamhouse Blush Satin Gradient -->
      <linearGradient id="hero_blushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="60%" stop-color="#FFF0F5" />
        <stop offset="100%" stop-color="#FFD1DC" />
      </linearGradient>

      <!-- Malibu Cyan Accent Gradient -->
      <linearGradient id="hero_cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00B4D8" />
        <stop offset="100%" stop-color="#0077B6" />
      </linearGradient>

      <!-- Card Glass Backdrop Gradient -->
      <linearGradient id="hero_cardGlass" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
        <stop offset="100%" stop-color="#FFF8FA" stop-opacity="0.95" />
      </linearGradient>

      <!-- Delicate Pink Hairline Gradient -->
      <linearGradient id="hero_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E0218A" stop-opacity="0.40" />
        <stop offset="45%" stop-color="#FFD1DC" stop-opacity="0.25" />
        <stop offset="75%" stop-color="#00B4D8" stop-opacity="0.20" />
        <stop offset="100%" stop-color="#C71585" stop-opacity="0.35" />
      </linearGradient>

      <!-- Winner Gold Accent Gradient -->
      <linearGradient id="hero_goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A" />
        <stop offset="50%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>

      <!-- Soft Ambient Radial Aura -->
      <radialGradient id="hero_radialAura" cx="85%" cy="15%" r="75%">
        <stop offset="0%" stop-color="#E0218A" stop-opacity="0.12" />
        <stop offset="35%" stop-color="#FFD1DC" stop-opacity="0.08" />
        <stop offset="70%" stop-color="#00B4D8" stop-opacity="0.03" />
        <stop offset="100%" stop-color="#FAFAFC" stop-opacity="0" />
      </radialGradient>

      <!-- Glam Drop Shadow Filter -->
      <filter id="hero_cardShadow" x="-10%" y="-10%" width="120%" height="125%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E0218A" flood-opacity="0.14" />
      </filter>

      <!-- Subtle Plaque Glow Filter -->
      <filter id="hero_pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  
    
    <!-- Light Studio Canvas Base with 24px Glam Radius -->
    <rect width="940" height="340" rx="24" fill="#FAFAFC" />
    <rect width="940" height="340" rx="24" fill="url(#hero_radialAura)" />

    <!-- Architectural Background Hairline Grid -->
    <g stroke="rgba(224, 33, 138, 0.06)" stroke-width="0.8">
      <line x1="56" y1="0" x2="56" y2="340" />
      <line x1="884" y1="0" x2="884" y2="340" />
      <line x1="0" y1="46" x2="940" y2="46" />
      <line x1="0" y1="284" x2="940" y2="284" />
      <circle cx="760" cy="170" r="140" stroke="rgba(224, 33, 138, 0.05)" fill="none" />
    </g>

    <!-- Main Pure White Surface Card with Glam Drop Shadow -->
    <rect x="16" y="16" width="908" height="308" rx="24"
          fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.22)" stroke-width="1" filter="url(#hero_cardShadow)" />

    <!-- Abstract Barbie Silhouette / Ponytail Flowing Vector Graphic -->
    
    <g transform="translate(650, 20) scale(1.05)" opacity="0.07" fill="#E0218A">
      <path d="
        M 10 90
        C 15 65, 30 45, 55 35
        C 80 25, 110 30, 125 50
        C 140 70, 135 100, 115 125
        C 105 138, 95 155, 95 175
        C 95 195, 105 210, 120 225
        C 100 220, 80 210, 68 190
        C 58 175, 58 150, 68 130
        C 75 115, 78 95, 65 80
        C 52 65, 35 68, 25 78
        C 18 85, 14 90, 10 90
        Z
      " />
      <path d="
        M 120 45
        C 145 20, 185 15, 215 35
        C 245 55, 260 95, 240 135
        C 225 165, 195 195, 180 230
        C 170 255, 175 275, 195 295
        C 170 285, 155 260, 155 235
        C 155 205, 180 175, 200 145
        C 220 115, 220 80, 195 60
        C 175 45, 145 42, 120 45
        Z
      " />
      <path d="
        M 68 190
        C 80 220, 105 250, 140 270
        C 115 265, 90 250, 75 230
        C 65 215, 62 200, 68 190
        Z
      " />
    </g>
  

    <!-- Corner Editorial Framing Accents -->
    <g stroke="#E0218A" stroke-width="1.5" stroke-opacity="0.45" fill="none">
      <path d="M 28 40 L 28 28 L 40 28" />
      <path d="M 900 28 L 912 28 L 912 40" />
      <path d="M 28 300 L 28 312 L 40 312" />
      <path d="M 900 312 L 912 312 L 912 300" />
    </g>

    <!-- Header Brand Bar -->
    <g transform="translate(46, 42)">
      <!-- Brand Pill -->
      <rect x="0" y="0" width="248" height="24" rx="12" fill="#FFF5F8" stroke="rgba(224, 33, 138, 0.22)" stroke-width="0.8" />
      <circle cx="12" cy="12" r="3.5" fill="#E0218A">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="15.5" class="code-mono" font-size="9" font-weight="700" fill="#C71585" letter-spacing="0.12em">
        ATELIER NO. 500 · AI/ML &amp; SYSTEMS
      </text>
    </g>

    <!-- Right Telemetry Badge -->
    <g transform="translate(894, 42)">
      <text x="0" y="15.5" text-anchor="end" class="code-mono" font-size="9.5" fill="#6B7280" letter-spacing="0.14em">
        @Shambhavi500 // PICT ENTC &apos;28
      </text>
    </g>

    <!-- Flowing Decorative Accent Ribbon -->
    <path d="M 46 80 C 120 74, 200 86, 290 80" stroke="url(#hero_barbieGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Main Editorial Heading: Hi, I'm Shambhavi. -->
    <g transform="translate(46, 126)">
      <text x="0" y="0" class="display-title" font-size="42" fill="#2D2D2D">
        Hi, I&apos;m <tspan fill="#E0218A">Shambhavi</tspan><tspan fill="#2D2D2D">.</tspan>
      </text>
    </g>

    <!-- Subtitle: Disciplines & Domains -->
    <g transform="translate(46, 160)">
      <text x="0" y="0" class="code-mono" font-size="11.5" font-weight="700" fill="#C71585" letter-spacing="0.08em">
        AI/ML RESEARCH &amp; DEVELOPMENT • SOFTWARE SYSTEMS • SATELLITE AGRITECH
      </text>
    </g>

    <!-- Mission Statement -->
    <g transform="translate(46, 190)">
      <text x="0" y="0" class="editorial-sans" font-size="14" fill="#2D2D2D">
        Building intelligent, data-driven autonomous systems with real-world impact.
      </text>
    </g>

    <!-- Editorial Status & Credential Telemetry Badges (Clear Non-Deceptive Indicators) -->
    <g transform="translate(46, 218)">
      <!-- Badge 1: Mindstrix Role -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="205" height="26" rx="13" fill="#111116" />
        <circle cx="12" cy="13" r="3" fill="#00B4D8" />
        <text x="22" y="16.5" class="code-mono" font-size="8.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.04em">
          AI/ML R&amp;D INTERN @ MINDSTRIX
        </text>
      </g>

      <!-- Badge 2: Academic Pedigree -->
      <g transform="translate(215, 0)">
        <rect x="0" y="0" width="145" height="26" rx="13" fill="#FFF5F8" stroke="rgba(224, 33, 138, 0.22)" stroke-width="1" />
        <text x="72.5" y="16.5" text-anchor="middle" class="code-mono" font-size="8.5" font-weight="700" fill="#C71585" letter-spacing="0.04em">
          PICT ENTC · CGPA 8.6
        </text>
      </g>

      <!-- Badge 3: TechFiesta Win -->
      <g transform="translate(370, 0)">
        <rect x="0" y="0" width="168" height="26" rx="13" fill="url(#hero_barbieGrad)" />
        <text x="84" y="16.5" text-anchor="middle" class="code-mono" font-size="8.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.04em">
          ★ TECHFIESTA &apos;26 WINNER
        </text>
      </g>

      <!-- Badge 4: Pune Agri Hackathon -->
      <g transform="translate(548, 0)">
        <rect x="0" y="0" width="162" height="26" rx="13" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
        <text x="81" y="16.5" text-anchor="middle" class="code-mono" font-size="8.5" font-weight="700" fill="#B45309" letter-spacing="0.04em">
          ★ ₹15L GRANT · AGRI HACK
        </text>
      </g>
    </g>

    <!-- Bottom Telemetry Specs Strip -->
    <g transform="translate(46, 292)">
      <!-- Separator line -->
      <line x1="0" y1="-14" x2="848" y2="-14" stroke="rgba(17, 17, 22, 0.08)" stroke-width="1" />

      <text x="0" y="0" class="code-mono" font-size="9" fill="#6B7280" letter-spacing="0.06em">
        STATUS: <tspan fill="#00E676" font-weight="700">● ACTIVE IN R&amp;D</tspan>
      </text>

      <text x="145" y="0" class="code-mono" font-size="9" fill="#6B7280" letter-spacing="0.06em">
        REPOSITORIES: <tspan fill="#E0218A" font-weight="700">14 PUBLIC</tspan>
      </text>

      <text x="325" y="0" class="code-mono" font-size="9" fill="#6B7280" letter-spacing="0.06em">
        CORE STACK: <tspan fill="#2D2D2D" font-weight="700">PYTHON · TYPESCRIPT · JAVASCRIPT</tspan>
      </text>

      <text x="848" y="0" text-anchor="end" class="code-mono" font-size="9" font-weight="700" fill="#E0218A" letter-spacing="0.1em">
        HAUTE COUTURE ENGINEERING
      </text>
    </g>

    <!-- Restrained Luxury Glint Sparkles -->
    
    <g class="glint-anim" style="transform-origin: 860px 110px;">
      <path d="
        M 860 103
        Q 863.08 106.92 867 110
        Q 863.08 113.08 860 117
        Q 856.92 113.08 853 110
        Q 856.92 106.92 860 103
        Z"
        fill="#E0218A"
        opacity="0.88"
      />
      <circle cx="860" cy="110" r="1.9600000000000002" fill="#FFFFFF" />
    </g>
  
    
    <g class="glint-anim" style="transform-origin: 750px 180px;">
      <path d="
        M 750 174.5
        Q 752.42 177.58 755.5 180
        Q 752.42 182.42 750 185.5
        Q 747.58 182.42 744.5 180
        Q 747.58 177.58 750 174.5
        Z"
        fill="#FFD1DC"
        opacity="0.88"
      />
      <circle cx="750" cy="180" r="1.54" fill="#FFFFFF" />
    </g>
  
    
    <g class="glint-anim" style="transform-origin: 830px 240px;">
      <path d="
        M 830 235
        Q 832.2 237.8 835 240
        Q 832.2 242.2 830 245
        Q 827.8 242.2 825 240
        Q 827.8 237.8 830 235
        Z"
        fill="#00B4D8"
        opacity="0.88"
      />
      <circle cx="830" cy="240" r="1.4000000000000001" fill="#FFFFFF" />
    </g>
  
    
    <g class="glint-anim" style="transform-origin: 310px 78px;">
      <path d="
        M 310 73.5
        Q 311.98 76.02 314.5 78
        Q 311.98 79.98 310 82.5
        Q 308.02 79.98 305.5 78
        Q 308.02 76.02 310 73.5
        Z"
        fill="#E0218A"
        opacity="0.88"
      />
      <circle cx="310" cy="78" r="1.2600000000000002" fill="#FFFFFF" />
    </g>
  
  </svg>