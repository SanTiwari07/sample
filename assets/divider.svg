<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 36" width="100%" height="36" fill="none">
    
    <defs>
      <!-- Embedded Styles in XML CDATA -->
      <style type="text/css"><![CDATA[
        .display-title {
          font-family: 'Montserrat', 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
        }
        .editorial-title {
          font-family: 'Cinzel', 'Playfair Display', 'Didot', Georgia, serif;
          font-weight: 700;
          letter-spacing: 0.08em;
        }
        .editorial-script {
          font-family: 'Pacifico', 'Cinzel', 'Playfair Display', 'Brush Script MT', cursive, sans-serif;
          letter-spacing: 0.02em;
        }
        .editorial-sans {
          font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-weight: 500;
        }
        .code-mono {
          font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
        }
        
        /* Subtle Shimmer & Pulse Keyframes */
        @keyframes subtlePulse {
          0%, 100% { opacity: 0.85; }
          50% { opacity: 1; }
        }
        @keyframes glint {
          0%, 100% { transform: scale(0.95); opacity: 0.7; }
          50% { transform: scale(1.08); opacity: 1; }
        }
        
        .pulse-anim {
          animation: subtlePulse 3s ease-in-out infinite;
        }
        .glint-anim {
          animation: glint 3.5s ease-in-out infinite;
          transform-origin: center;
        }
      ]]></style>

      <!-- Signature Barbie Gradient: Hot Pink -> Barbie Pink -> Retro Magenta -->
      <linearGradient id="div_barbieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FF2D87" />
        <stop offset="50%" stop-color="#E0218A" />
        <stop offset="100%" stop-color="#C71585" />
      </linearGradient>

      <!-- Dreamhouse Canvas Pink Gradient (Eliminates White Element) -->
      <linearGradient id="div_canvasPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF0F6" />
        <stop offset="50%" stop-color="#FFE4F0" />
        <stop offset="100%" stop-color="#FFD6EA" />
      </linearGradient>

      <!-- Dreamhouse Blush Satin Gradient -->
      <linearGradient id="div_blushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF5FA" />
        <stop offset="50%" stop-color="#FFEBF3" />
        <stop offset="100%" stop-color="#FFD1DC" />
      </linearGradient>

      <!-- Malibu Cyan Accent Gradient -->
      <linearGradient id="div_cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00B4D8" />
        <stop offset="100%" stop-color="#0077B6" />
      </linearGradient>

      <!-- Card Glass Backdrop Gradient -->
      <linearGradient id="div_cardGlass" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFF8FA" stop-opacity="0.98" />
        <stop offset="100%" stop-color="#FFE8F2" stop-opacity="0.96" />
      </linearGradient>

      <!-- Delicate Pink Hairline Gradient -->
      <linearGradient id="div_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E0218A" stop-opacity="0.55" />
        <stop offset="45%" stop-color="#FFD1DC" stop-opacity="0.40" />
        <stop offset="75%" stop-color="#00B4D8" stop-opacity="0.30" />
        <stop offset="100%" stop-color="#C71585" stop-opacity="0.50" />
      </linearGradient>

      <!-- Winner Gold Accent Gradient -->
      <linearGradient id="div_goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A" />
        <stop offset="50%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>

      <!-- Soft Ambient Radial Aura -->
      <radialGradient id="div_radialAura" cx="85%" cy="15%" r="75%">
        <stop offset="0%" stop-color="#E0218A" stop-opacity="0.18" />
        <stop offset="35%" stop-color="#FFD1DC" stop-opacity="0.12" />
        <stop offset="70%" stop-color="#00B4D8" stop-opacity="0.04" />
        <stop offset="100%" stop-color="#FFF0F6" stop-opacity="0" />
      </radialGradient>

      <!-- Glam Drop Shadow Filter -->
      <filter id="div_cardShadow" x="-10%" y="-10%" width="120%" height="125%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E0218A" flood-opacity="0.14" />
      </filter>

      <!-- Subtle Plaque Glow Filter -->
      <filter id="div_pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  
    
    <!-- Left Flowing Pink Curve -->
    <path d="M 42 18 C 160 12, 280 24, 430 18" stroke="url(#div_barbieGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 120 18 C 220 22, 320 14, 410 18" stroke="rgba(224, 33, 138, 0.45)" stroke-width="1" stroke-linecap="round" opacity="0.6" />

    <!-- Center Editorial Monogram Knot -->
    <g transform="translate(470, 18)">
      <circle cx="0" cy="0" r="10" fill="#FFFFFF" stroke="#E0218A" stroke-width="1.2" />
      <polygon points="0,-4.5 4.5,0 0,4.5 -4.5,0" fill="#E0218A" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Right Flowing Pink Curve -->
    <path d="M 510 18 C 660 12, 780 24, 898 18" stroke="url(#div_barbieGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 530 18 C 620 22, 720 14, 820 18" stroke="rgba(224, 33, 138, 0.45)" stroke-width="1" stroke-linecap="round" opacity="0.6" />

    <!-- Restrained Sparkles -->
    
    <g class="glint-anim" style="transform-origin: 420px 18px;">
      <path d="
        M 420 13.5
        Q 421.98 16.02 424.5 18
        Q 421.98 19.98 420 22.5
        Q 418.02 19.98 415.5 18
        Q 418.02 16.02 420 13.5
        Z"
        fill="#E0218A"
        opacity="0.88"
      />
      <circle cx="420" cy="18" r="1.2600000000000002" fill="#FFFFFF" />
    </g>
  
    
    <g class="glint-anim" style="transform-origin: 520px 18px;">
      <path d="
        M 520 13.5
        Q 521.98 16.02 524.5 18
        Q 521.98 19.98 520 22.5
        Q 518.02 19.98 515.5 18
        Q 518.02 16.02 520 13.5
        Z"
        fill="#FFD1DC"
        opacity="0.88"
      />
      <circle cx="520" cy="18" r="1.2600000000000002" fill="#FFFFFF" />
    </g>
  
  </svg>