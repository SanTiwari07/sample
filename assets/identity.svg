<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="100%" height="310" fill="none">
    
    <defs>
      <!-- Embedded Styles in XML CDATA -->
      <style type="text/css"><![CDATA[
        .display-title {
          font-family: 'Montserrat', 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
        }
        .editorial-title {
          font-family: 'Cinzel', 'Playfair Display', 'Didot', Georgia, serif;
          font-weight: 700;
          letter-spacing: 0.08em;
        }
        .editorial-script {
          font-family: 'Pacifico', 'Cinzel', 'Playfair Display', 'Brush Script MT', cursive, sans-serif;
          letter-spacing: 0.02em;
        }
        .editorial-sans {
          font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-weight: 500;
        }
        .code-mono {
          font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
        }
        
        /* Subtle Shimmer & Pulse Keyframes */
        @keyframes subtlePulse {
          0%, 100% { opacity: 0.85; }
          50% { opacity: 1; }
        }
        @keyframes glint {
          0%, 100% { transform: scale(0.95); opacity: 0.7; }
          50% { transform: scale(1.08); opacity: 1; }
        }
        
        .pulse-anim {
          animation: subtlePulse 3s ease-in-out infinite;
        }
        .glint-anim {
          animation: glint 3.5s ease-in-out infinite;
          transform-origin: center;
        }
      ]]></style>

      <!-- Signature Barbie Gradient: Hot Pink -> Barbie Pink -> Retro Magenta -->
      <linearGradient id="ident_barbieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FF2D87" />
        <stop offset="50%" stop-color="#E0218A" />
        <stop offset="100%" stop-color="#C71585" />
      </linearGradient>

      <!-- Dreamhouse Blush Satin Gradient -->
      <linearGradient id="ident_blushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="60%" stop-color="#FFF0F5" />
        <stop offset="100%" stop-color="#FFD1DC" />
      </linearGradient>

      <!-- Malibu Cyan Accent Gradient -->
      <linearGradient id="ident_cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00B4D8" />
        <stop offset="100%" stop-color="#0077B6" />
      </linearGradient>

      <!-- Card Glass Backdrop Gradient -->
      <linearGradient id="ident_cardGlass" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
        <stop offset="100%" stop-color="#FFF8FA" stop-opacity="0.95" />
      </linearGradient>

      <!-- Delicate Pink Hairline Gradient -->
      <linearGradient id="ident_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E0218A" stop-opacity="0.40" />
        <stop offset="45%" stop-color="#FFD1DC" stop-opacity="0.25" />
        <stop offset="75%" stop-color="#00B4D8" stop-opacity="0.20" />
        <stop offset="100%" stop-color="#C71585" stop-opacity="0.35" />
      </linearGradient>

      <!-- Winner Gold Accent Gradient -->
      <linearGradient id="ident_goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A" />
        <stop offset="50%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>

      <!-- Soft Ambient Radial Aura -->
      <radialGradient id="ident_radialAura" cx="85%" cy="15%" r="75%">
        <stop offset="0%" stop-color="#E0218A" stop-opacity="0.12" />
        <stop offset="35%" stop-color="#FFD1DC" stop-opacity="0.08" />
        <stop offset="70%" stop-color="#00B4D8" stop-opacity="0.03" />
        <stop offset="100%" stop-color="#FAFAFC" stop-opacity="0" />
      </radialGradient>

      <!-- Glam Drop Shadow Filter -->
      <filter id="ident_cardShadow" x="-10%" y="-10%" width="120%" height="125%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E0218A" flood-opacity="0.14" />
      </filter>

      <!-- Subtle Plaque Glow Filter -->
      <filter id="ident_pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  
    
    <!-- Light Studio Canvas Base -->
    <rect width="940" height="310" rx="24" fill="#FAFAFC" />
    
    <!-- Outer Card with Soft Glam Shadow -->
    <rect x="16" y="16" width="908" height="278" rx="24"
          fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.22)" stroke-width="1" filter="url(#ident_cardShadow)" />

    <!-- Section Header Tag -->
    <g transform="translate(42, 40)">
      <text x="0" y="0" class="code-mono" font-size="10.5" font-weight="700" fill="#C71585" letter-spacing="0.14em">
        THE PERSON // ENGINEERING PROFILE &amp; FOCUS
      </text>
    </g>
    <g transform="translate(898, 40)">
      <text x="0" y="0" text-anchor="end" class="code-mono" font-size="9" fill="#6B7280" letter-spacing="0.12em">
        ATELIER NO. 500 · PUNE, INDIA
      </text>
    </g>

    <!-- Header Divider Line -->
    <line x1="42" y1="52" x2="898" y2="52" stroke="rgba(17, 17, 22, 0.08)" stroke-width="1" />

    <!-- Left Column: Editorial Builder Card -->
    <g transform="translate(42, 68)">
      <!-- Outer Frame -->
      <rect x="0" y="0" width="245" height="206" rx="16" fill="#FFF5F8" stroke="rgba(224, 33, 138, 0.22)" stroke-width="0.8" />
      
      <!-- Inner White Portrait Bezel -->
      <rect x="12" y="12" width="221" height="126" rx="12" fill="#FFFFFF" stroke="rgba(17, 17, 22, 0.08)" stroke-width="0.8" />
      
      <!-- Monogram Art with Barbie Pink Accent Circle -->
      <circle cx="122.5" cy="62" r="34" fill="#FFF5F8" stroke="rgba(224, 33, 138, 0.32)" stroke-width="1.5" />
      <text x="122.5" y="70" text-anchor="middle" class="editorial-title" font-size="22" font-weight="800" fill="#2D2D2D">
        SP
      </text>
      
      <!-- Verification Badge Pill -->
      <rect x="36" y="108" width="173" height="20" rx="10" fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.32)" stroke-width="0.8" />
      <circle cx="48" cy="118" r="3" fill="#00E676" />
      <text x="58" y="121.5" class="code-mono" font-size="8.5" font-weight="700" fill="#2D2D2D" letter-spacing="0.06em">
        VERIFIED BUILDER · CGPA 8.6
      </text>

      <!-- Identity Meta beneath portrait -->
      <text x="122.5" y="164" text-anchor="middle" class="editorial-sans" font-size="14" font-weight="800" fill="#2D2D2D">
        Shambhavi Patil
      </text>
      <text x="122.5" y="184" text-anchor="middle" class="code-mono" font-size="9" font-weight="600" fill="#E0218A" letter-spacing="0.06em">
        @Shambhavi500 · B.Tech ENTC
      </text>
    </g>

    <!-- Right Column: Editorial Bio & 3 Engineering Pillars -->
    <g transform="translate(315, 68)">
      <!-- Statement Heading -->
      <text x="0" y="18" class="display-title" font-size="18" font-weight="800" fill="#2D2D2D">
        ARCHITECTING IMPACT THROUGH CODE &amp; SILICON
      </text>
      
      <!-- Bio Quote Card with Pink Hairline Accent -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="583" height="56" rx="12" fill="#FFF5F8" stroke="rgba(224, 33, 138, 0.22)" stroke-width="0.8" />
        <line x1="0" y1="0" x2="0" y2="56" stroke="url(#ident_barbieGrad)" stroke-width="4" />
        <text x="16" y="24" class="editorial-sans" font-size="11.5" fill="#2D2D2D" font-style="italic">
          &quot;ENTC undergraduate | Curious about technology, systems, and their real-world impact | Learning by building projects&quot;
        </text>
        <text x="16" y="44" class="code-mono" font-size="9" fill="#E0218A" font-weight="700" letter-spacing="0.06em">
          // PUNE INSTITUTE OF COMPUTER TECHNOLOGY (PICT) · B.TECH ENTC
        </text>
      </g>

      <!-- 3 Strategic Pillars of Shambhavi's Work -->
      <g transform="translate(0, 106)">
        <!-- Pillar 1: Autonomous AI -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="186" height="92" rx="12" fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.22)" stroke-width="0.8" />
          <text x="14" y="22" class="code-mono" font-size="8.5" font-weight="700" fill="#E0218A" letter-spacing="0.1em">
            01 / AGENTIC AI
          </text>
          <text x="14" y="42" class="editorial-sans" font-size="12" font-weight="700" fill="#2D2D2D">
            Autonomous Systems
          </text>
          <text x="14" y="60" class="editorial-sans" font-size="9.5" fill="#2D2D2D">
            Multi-agent workflows &amp;
          </text>
          <text x="14" y="74" class="editorial-sans" font-size="9.5" fill="#6B7280">
            intelligent automation (Ovio)
          </text>
        </g>

        <!-- Pillar 2: AgriTech -->
        <g transform="translate(198, 0)">
          <rect x="0" y="0" width="186" height="92" rx="12" fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.22)" stroke-width="0.8" />
          <text x="14" y="22" class="code-mono" font-size="8.5" font-weight="700" fill="#E0218A" letter-spacing="0.1em">
            02 / EARTH &amp; AGRI
          </text>
          <text x="14" y="42" class="editorial-sans" font-size="12" font-weight="700" fill="#2D2D2D">
            Precision AgriTech
          </text>
          <text x="14" y="60" class="editorial-sans" font-size="9.5" fill="#2D2D2D">
            Satellite spectral analysis &amp;
          </text>
          <text x="14" y="74" class="editorial-sans" font-size="9.5" fill="#6B7280">
            AI advisory (KrishiSahAI)
          </text>
        </g>

        <!-- Pillar 3: FinTech & RL -->
        <g transform="translate(396, 0)">
          <rect x="0" y="0" width="186" height="92" rx="12" fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.22)" stroke-width="0.8" />
          <text x="14" y="22" class="code-mono" font-size="8.5" font-weight="700" fill="#E0218A" letter-spacing="0.1em">
            03 / QUANT &amp; FINTECH
          </text>
          <text x="14" y="42" class="editorial-sans" font-size="12" font-weight="700" fill="#2D2D2D">
            Autonomous FinTech
          </text>
          <text x="14" y="60" class="editorial-sans" font-size="9.5" fill="#2D2D2D">
            Reinforcement learning &amp;
          </text>
          <text x="14" y="74" class="editorial-sans" font-size="9.5" fill="#6B7280">
            revenue recovery OS (AIRA)
          </text>
        </g>
      </g>
    </g>

    <!-- Restrained Luxury Glint Sparkles -->
    
    <g class="glint-anim" style="transform-origin: 895px 65px;">
      <path d="
        M 895 59
        Q 897.64 62.36 901 65
        Q 897.64 67.64 895 71
        Q 892.36 67.64 889 65
        Q 892.36 62.36 895 59
        Z"
        fill="#E0218A"
        opacity="0.88"
      />
      <circle cx="895" cy="65" r="1.68" fill="#FFFFFF" />
    </g>
  
    
    <g class="glint-anim" style="transform-origin: 278px 260px;">
      <path d="
        M 278 255.5
        Q 279.98 258.02 282.5 260
        Q 279.98 261.98 278 264.5
        Q 276.02 261.98 273.5 260
        Q 276.02 258.02 278 255.5
        Z"
        fill="#FFD1DC"
        opacity="0.88"
      />
      <circle cx="278" cy="260" r="1.2600000000000002" fill="#FFFFFF" />
    </g>
  
  </svg>